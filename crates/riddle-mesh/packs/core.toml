id = "core"
name = "Core"
version = 4
area = "Essentials"
summary = "Never hides the people you protect, sets scams apart, surfaces mail from people you write to and real security alerts, and gives everything else a place to land."
band = "specific"

[detect]
always = true

[[meshes]]
band = "safety"
rank = 0
text = '''
Mesh: System guards
Scope:
All Digs

GUARDS

NEVER Spoil IF sender IN never_hidden
NEVER Contamination IF sender IN never_hidden
NEVER Contamination IF sender IN contacts
NEVER Spoil IF sender_is_vip
NEVER Spoil IF sender IN family
NEVER Spoil IF has_calendar_part
'''

# v2: a recruiter is not a scam. "I came across your profile" is how a
# recruiter opens, and it scored .70 as a claim of prior contact; a message
# about a job for the reader skips that route (disguised glyphs still count).
[[meshes]]
band = "safety"
rank = 20
text = '''
Mesh: Cold outreach
Scope:
All Digs

ROUTES

WHEN cold_outreach
    IF glyph_substitution → Contamination
    ELSE IF claims_prior_contact@v1 > .6 AND recruiting@v1 < .80 → Contamination
END
'''

[[meshes]]
band = "safety"
rank = 25
text = '''
Mesh: Throwaway domains
Scope:
All Digs

ROUTES

WHEN suspicious_domain AND NOT known_sender
    IF asks_for_payment_or_credentials → Contamination
    ELSE → Spoil + Stratum: Suspicious
END
'''

# v2: a reply in a thread you or someone you know already wrote in, or from
# a firm where you know someone, is correspondence (known_thread,
# known_domain): an accountant's reply in a household thread ended
# Unresolved as a stranger's.
[[meshes]]
band = "personal"
rank = 39
text = '''
Mesh: Human correspondence
Scope:
All Digs

ROUTES

WHEN (known_sender OR known_thread OR known_domain OR same_organisation) AND NOT automated_sender AND NOT from_me
    IF requires_response@v1 > .70
        → Find: Respond + Stratum: People
    ELSE IF asks_question@v1 > .75
        → Find: Respond + Stratum: People
    ELSE IF requires_action@v1 > .75
        → Find: Do + Stratum: People
    ELSE
        → Find: Know + Stratum: People
END
'''

# v2: the guard reads what the route reads. A security gear launch, a
# security newsletter and a bank's cashback promo scored .81-.96 as security
# alerts, and the guard kept 13 of them from Spoil though the route had
# already passed them over as marketing; a real alert is neither.
[[meshes]]
rank = 20
text = '''
Mesh: Security and account alerts
Scope:
All Digs

ROUTES

IF security_alert@v1 > .80 AND marketing@v1 < .70
    → Find: Know + Stratum: Notifications

GUARDS

NEVER Spoil IF security_alert@v1 > .80 AND marketing@v1 < .70 AND newsletter@v1 < .80
'''

[[meshes]]
rank = 25
text = '''
Mesh: Calendar
Scope:
All Digs

ROUTES

IF has_calendar_part
    → Find: Attend
ELSE IF meeting_related@v1 > .85 AND requires_response@v1 > .70
    → Find: Attend
'''

# v2: account notices were just out of reach. Terms and privacy notices
# (an app store's terms, a bank's agreement) scored .55-.75 as routine, and
# a to-do on an account (verify a developer account, confirm your client
# details) is not routine at all; 13 went Unresolved. Policy notices are
# Filed by subject first, so they land with no judge; an account notice
# that wants something done is a Do Find; routine needs only be likely.
#
# v3: a repeated notice is one Find. A smart lock's "batteries are
# critically low" came every few days from July and stood as 33 Do Finds;
# a registrar's "2 of Your Domain Names Expire Soon" as 30, Search Console's
# indexing notices as 8 (16 Oct 2026). With Replaces the newest from a
# sender stays open and the earlier ones close as Superseded, as Daily
# reminders does.
#
# v4: the series is keyed by the subject too (`Replaces: same subject`),
# read past its numbers. Keyed by the sender alone, a registrar's one
# reminder per domain replaced the other domains', and a ticket reply
# replaced a renewal notice; a sender runs several notices at once.
[[meshes]]
band = "fallback"
rank = 4
fallback = true
text = '''
Mesh: Account notices
Scope:
All Digs

ROUTES

IF (automated_sender OR list_unsubscribe) AND NOT gmail_category = promotions AND (subject CONTAINS "terms of service" OR subject CONTAINS "terms of use" OR subject CONTAINS "privacy policy" OR subject CONTAINS "privacy notice" OR subject CONTAINS "legal update" OR subject CONTAINS "agreement")
    → Filed + Stratum: Notifications
ELSE IF account_notification@v1 > .85 AND requires_action@v1 > .75 AND marketing@v1 < .70
    → Find: Do + Stratum: Notifications + Replaces: same subject
ELSE IF account_notification@v1 > .85 AND routine@v1 > .50
    → Filed + Stratum: Notifications
'''

[[meshes]]
band = "fallback"
rank = 5
fallback = true
text = '''
Mesh: Updates
Scope:
All Digs

ROUTES

IF gmail_category = updates AND list_unsubscribe AND newsletter@v1 > .60
    → Filed + Stratum: Newsletters
ELSE IF gmail_category = updates AND (list_unsubscribe OR automated_sender)
    → Filed + Stratum: Notifications
ELSE IF gmail_category = updates AND transactional@v1 > .70
    → Filed + Stratum: Notifications
'''

[[meshes]]
band = "fallback"
rank = 10
fallback = true
text = '''
Mesh: Automated notifications
Scope:
All Digs

ROUTES

IF automated_sender AND routine@v1 > .85 AND personally_relevant@v1 < .40
    → Spoil + Stratum: Notifications
ELSE IF automated_sender AND social_notification@v1 > .85
    → Spoil + Stratum: Notifications
ELSE IF automated_sender AND transactional@v1 > .80
    → Filed + Stratum: Notifications
'''
