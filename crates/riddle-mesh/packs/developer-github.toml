id = "developer-github"
name = "GitHub"
version = 4
area = "Developer"
summary = "Reviews you were asked for personally (at low importance when a bot such as Dependabot asked), failed Actions runs, assignments and admin requests become Finds; team review requests and new pull requests are Filed; approvals, merges, bot comments and pushes are set aside."
band = "specific"

[detect]
sender_domains = ["github.com"]
min_messages = 10

# v2: a review Dependabot requested was as urgent as a colleague's. The
# account that acted is the From name (notifications@github.com sends them
# all), so the list names accounts, not addresses. Empty it to treat bot
# reviews like anyone's.
[[lists]]
name = "github_bots"
description = "GitHub accounts whose review requests can wait"
question = "Which GitHub accounts' review requests are low priority for you (dependabot[bot], renovate[bot])? Leave it empty to treat them like anyone's."
default = ["dependabot[bot]", "renovate[bot]"]

# v3 added the engineering_vendors list and its Engineering vendors tag
# Mesh (a registrar's renewal is engineering and a bill at once, 16 Oct
# 2026). v4 moves both to the Engineering pack, so an account without
# GitHub still gets them (18 Oct 2026); that pack takes the Mesh over on
# install, and reinstalling this one leaves it alone.

[[meshes]]
rank = 10
text = '''
Mesh: GitHub Notifications
Scope:
All Digs

ROUTES

WHEN sender_domain CONTAINS "github.com"
    IF sender != "notifications@github.com" AND (subject CONTAINS "requesting updated permissions" OR subject CONTAINS "Request to install" OR subject CONTAINS "Request to dismiss")
        → Find: Do + Stratum: Engineering
    ELSE IF sender != "notifications@github.com" AND (security_alert@v1 > .80 OR payment_related@v1 > .80 OR account_notification@v1 > .80)
        → Find: Know + Stratum: Engineering
    ELSE IF sender != "notifications@github.com"
        → Spoil
    ELSE IF github_event = review_requested_you AND sender_name IN list:github_bots
        → Find: Review + Stratum: Engineering + Importance: Low
    ELSE IF github_event = review_requested_you
        → Find: Review + Stratum: Engineering
    ELSE IF github_event = run_failed
        → Find: Do + Stratum: Engineering + Expires: 2d
    ELSE IF github_event = changes_requested AND github_reason = author
        → Find: Do + Stratum: Engineering
    ELSE IF github_event = review_requested_team OR github_event = opened
        → Filed + Stratum: Engineering
    ELSE IF github_reason = assign
        → Find: Do + Stratum: Engineering
    ELSE IF github_reason = security_alert
        → Find: Know + Stratum: Engineering
    ELSE IF github_event = commented AND github_reason = author AND requires_response@v1 > .70
        → Find: Respond + Stratum: Engineering
    ELSE
        → Spoil + Stratum: Engineering
END

GUARDS

NEVER Spoil IF sender IN never_hidden
'''
