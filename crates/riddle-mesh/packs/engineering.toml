# The tag: engineering mail carries Engineering whatever else decides it.
# The money rules keep a bill a Pay Find under Finance; this adds the
# second Stratum.
[[meshes]]
band = "personal"
rank = 35
text = '''
Mesh: Engineering vendors
Scope:
All Digs

ROUTES

IF sender IN list:engineering_vendors OR sender IN list:engineering_senders
    → Stratum: Engineering
'''

# Search Console writes about the user's own site. An ownership or
# verification change is security; a new indexing problem is something to
# do, and the same problem is reported again every few days, so the newest
# replaces the rest; fixes validating or fixed, and the reports, are Filed.
[[meshes]]
rank = 12
text = '''
Mesh: Search Console
Scope:
All Digs

ROUTES

WHEN sender = "sc-noreply@google.com"
    IF subject CONTAINS "owner" OR subject CONTAINS "verif" OR subject CONTAINS "manual action" OR subject CONTAINS "security issue" OR subject CONTAINS "hacked"
        → Find: Do + Stratum: Engineering + Importance: High
    ELSE IF subject CONTAINS "prevent pages" OR subject CONTAINS "fixes failed" OR subject CONTAINS "not indexed" OR subject CONTAINS "issues detected" OR subject CONTAINS "new issue" OR subject CONTAINS "errors" OR subject CONTAINS "problem"
        → Find: Do + Stratum: Engineering + Replaces: same subject
    ELSE IF subject CONTAINS "successfully fixed" OR subject CONTAINS "validating" OR subject CONTAINS "validation" OR subject CONTAINS "performance" OR subject CONTAINS "report" OR subject CONTAINS "top "
        → Filed + Stratum: Engineering
    ELSE
        → Find: Know + Stratum: Engineering + Importance: Low
END
'''

# What a vendor asks for, by the subject it writes: an action with a date,
# a deprecation or migration, an incident, a certificate or anything else
# expiring, a cost alert. Rank 19 sits behind the money rules (a failed
# payment is theirs) and ahead of the general security alert, so an
# engineering account's security notice carries Engineering. A person at a
# vendor who writes gets Respond; product news is Filed, never Spoil, so it
# stays findable; everything else from these senders is Filed.
[[meshes]]
rank = 19
text = '''
Mesh: Engineering alerts
Scope:
All Digs

ROUTES

WHEN (sender IN list:engineering_vendors OR sender IN list:engineering_senders) AND NOT gmail_category = promotions
    IF subject CONTAINS "action required" OR subject CONTAINS "action needed" OR subject CONTAINS "deprecat" OR subject CONTAINS "end of life" OR subject CONTAINS "end-of-life" OR subject CONTAINS "will be removed" OR subject CONTAINS "will be deleted" OR subject CONTAINS "will be disabled" OR subject CONTAINS "migrat" OR subject CONTAINS "breaking change"
        → Find: Do + Stratum: Engineering + Importance: High + Replaces: same subject
    ELSE IF subject CONTAINS "vulnerab" OR subject CONTAINS "security advisory" OR subject CONTAINS "cve-" OR subject CONTAINS "certificate" OR subject CONTAINS "expir" OR subject CONTAINS "incident" OR subject CONTAINS "outage" OR subject CONTAINS "degraded" OR subject CONTAINS "health event" OR subject CONTAINS "maintenance" OR subject CONTAINS "failed" OR subject CONTAINS "failure"
        → Find: Do + Stratum: Engineering + Importance: High + Expires: 7d
    ELSE IF subject CONTAINS "budget" OR subject CONTAINS "spend cap" OR subject CONTAINS "spending" OR subject CONTAINS "usage limit" OR subject CONTAINS "quota" OR subject CONTAINS "free tier" OR subject CONTAINS "credits" OR subject CONTAINS "rate limit"
        → Find: Know + Stratum: Engineering + Importance: High
    ELSE IF security_alert@v1 > .80 AND marketing@v1 < .70
        → Find: Know + Stratum: Engineering + Importance: High
    ELSE IF NOT automated_sender AND (requires_response@v1 > .70 OR asks_question@v1 > .75)
        → Find: Respond + Stratum: Engineering
    ELSE IF marketing@v1 > .70 OR newsletter@v1 > .70
        → Filed + Stratum: Engineering
    ELSE IF requires_action@v1 > .75
        → Find: Do + Stratum: Engineering
    ELSE
        → Filed + Stratum: Engineering
END

GUARDS

NEVER Spoil IF sender IN never_hidden
'''
