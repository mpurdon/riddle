id = "engineering"
name = "Engineering"
version = 1
area = "Developer"
summary = "Mail from the cloud, the registrar, the search console, developer tooling and AI coding tools is Engineering: an action a vendor asks for, an incident, an expiring certificate or a cost alert becomes a Find, indexing problems from the search console too; product news and routine notices are Filed; bills stay with the money rules and carry Engineering as well."
band = "specific"

# v1 (18 Oct 2026): Search Console mail about page indexing on the user's
# own site, and a Gemini API spend cap, were plain notifications, because
# google.com sends everything from account security to Play receipts and a
# vendor list names domains. The engineering vendors list and its tag Mesh
# move here from the GitHub pack (v3) so an account without GitHub still
# gets them, and a second list names the addresses at mixed-purpose
# companies (Google, Amazon, Apple, Microsoft, Meta) that are developer
# consoles. The money rules run first and keep a vendor's bill a Pay Find
# under Finance; the tag adds Engineering to it.

[detect]
sender_domains = [
  "amazonaws.com", "aws.com", "cloudflare.com", "vercel.com", "netlify.com",
  "digitalocean.com", "heroku.com", "fly.io", "railway.app", "render.com",
  "supabase.com", "npmjs.com", "pypi.org", "crates.io", "sentry.io",
  "datadoghq.com", "pagerduty.com", "gitlab.com", "atlassian.com",
  "jetbrains.com", "docker.com", "hashicorp.com", "circleci.com",
  "anthropic.com", "claude.com", "openai.com", "cursor.com", "kilocode.ai",
  "namecheap.com", "godaddy.com", "hover.com", "porkbun.com", "gandi.net",
