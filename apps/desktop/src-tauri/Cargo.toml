[package]
name = "riddle-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Riddle: an agent-native email client"
default-run = "riddle-desktop"

[lib]
name = "riddle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
riddle-errors.workspace = true
riddle-core.workspace = true
riddle-observability.workspace = true
riddle-store.workspace = true
riddle-settings.workspace = true
riddle-credentials.workspace = true
riddle-actions.workspace = true
riddle-app.workspace = true
riddle-mail.workspace = true
riddle-gmail.workspace = true
riddle-sync.workspace = true
riddle-projection.workspace = true
riddle-signals.workspace = true
riddle-judge.workspace = true
riddle-mesh.workspace = true
riddle-sift.workspace = true
riddle-finds.workspace = true
riddle-activity.workspace = true
riddle-ai.workspace = true
riddle-agent.workspace = true
riddle-expeditions.workspace = true
riddle-jobs.workspace = true
riddle-scheduler.workspace = true
riddle-search.workspace = true
riddle-people.workspace = true
riddle-context.workspace = true
riddle-privacy.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
parking_lot.workspace = true
chrono.workspace = true
dirs.workspace = true
